- aid: kixie:kixie-agent-status-api
  name: Kixie Agent Status API
  description: >-
    A read-only lookup that returns the current presence of a Kixie agent by email address —
    whether the agent's device is registered (logged in) and whether the agent is currently on a
    call — wrapped in a `success` / `result` envelope. Authenticated with the account API key as
    an `apiKey` query parameter.
  humanURL: https://support.kixie.com/hc/en-us/articles/360020051474-Kixie-Agent-Status-API
  baseURL: https://apig.kixie.com/www/agent/status
  tags:
  - Presence
