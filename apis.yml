- aid: kixie:kixie-webhook-management-api
  name: Kixie Webhook Management API
  description: >-
    A path-versioned management surface for Kixie's event webhooks. Four POST operations —
    postWebhook (create), putWebhook (update), getWebhooks (list) and removeWebhook (delete) —
    register HTTP callbacks for the eight documented event types (endcall, startcall,
    answeredcall, SMS, disposition, voicemail, scheduledactivity, cisummary), with optional
    direction, call-result and disposition filters and optional custom request headers.
  humanURL: https://support.kixie.com/hc/en-us/articles/20871662051739-Managing-Kixie-Event-Webhooks-via-API
  baseURL: https://apig.kixie.com/app/v1/api
  tags:
  - Webhook
  - Event
  - Management
  tags_raw:
  - Webhooks
  - Events
  - Management
  properties:
