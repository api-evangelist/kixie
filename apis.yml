apis:
- aid: kixie:kixie-event-api
  name: Kixie Event API
  description: >-
    The primary Kixie automation surface. A single POST endpoint on the apig.kixie.com gateway that
    dispatches on an `eventname` discriminator in the JSON body — `call` (place an outbound call
    through an agent), `sms` (send an SMS from an agent number), `bizsms` (send a Team/Business
    SMS), `queue` (send a call to, or remove it from, an inbound queue), `cadence` (add to or
    remove from an automation cadence), `updatepowerlist` (add or update a PowerList contact) and
    `removefrompowerlist` (remove from one or all PowerLists). Authenticated with an account API
    key passed both as a query parameter and in the body, alongside the account Business ID.
  humanURL: https://developer.kixie.com/
  baseURL: https://apig.kixie.com/app/event
  tags:
  - Voice
  - SMS
  - Power Dialer
  - Automation
