aid: kixie
name: Kixie
description: >-
  Kixie is a Los Angeles based sales-engagement and revenue-communications platform built around
  PowerCall, a multi-line power dialer, business phone service and SMS/MMS product that plugs
  bi-directionally into HubSpot, Salesforce, Pipedrive, Zoho and GoHighLevel. Its public developer
  surface is a small, event-oriented HTTP API served from the apig.kixie.com gateway: a single
  POST /app/event endpoint that dispatches on an eventname discriminator to place calls, send SMS
  and Team SMS, add and remove contacts from PowerLists, push numbers into and out of calling
  queues and cadences; a webhook management API for creating, listing, updating and deleting the
  eight documented event webhooks; and an agent-status lookup. Authentication is a single account
  scoped API key plus a Business ID, and the platform publishes a documented daily usage cap of
  10,000 API calls per account. Kixie publishes no OpenAPI, AsyncAPI or GraphQL contract and ships
  no first-party client SDKs; the reference is human-readable HTML on developer.kixie.com and in
  the Zendesk help center.
