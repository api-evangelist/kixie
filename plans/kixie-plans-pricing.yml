api_gating:
  page_claim: >-
    The pricing page's feature-comparison table shows "Developer API ✓" on all three tiers.
  docs_claim: >-
    Kixie's own API articles are stricter and inconsistent with the pricing table: the PowerList
    API article requires "a paid Kixie account with at least one Professional tier agent", and
    the Team SMS and Send to Queue articles state "You must be on the Professional Billing Tier
    or higher to access this API."
  activation_gate: >-
    Beyond any plan gate, the key itself must be switched on by a human: "you may need to contact
    Support via live chat in order for us to enable your API key." There is no self-service API
    onboarding path.
  finding: >-
    An integrator cannot self-serve. Even on a paid plan, first API use requires a support
    conversation, and no price is published to size the commitment.

