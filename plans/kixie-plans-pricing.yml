pricing_note: >-
  As of the 2026-08-12 fetch, no per-seat subscription price appears on https://www.kixie.com/pricing/
  in the served HTML — not hidden behind a monthly/annual toggle, simply absent. Each tier card
  ends in "TRY FREE". A prospective integrator cannot cost a Kixie deployment from public
  information, which is why this file records the tiers with `price: null` rather than omitting
  them.

