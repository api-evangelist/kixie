name: Kixie plans and pricing
description: >-
  Kixie publishes three named subscription tiers plus three add-ons on its public pricing page,
  but publishes no price for any of them. The page lists features and a 7-day free trial and
  routes every tier to a trial or demo CTA. The only dollar figures Kixie publishes anywhere on
  the page are usage rates, in the FAQ block — unlimited US/Canada minutes at $30/month per user,
  SMS from $0.011 per message, and additional US/Canada DIDs at $5.00/month.

