security_txt:
  served: false
  note: >-
    No RFC 9116 security.txt is served on any host. Kixie does, however, publish a security
    contact and reporting instructions as an HTML page at https://www.kixie.com/security/ —
    captured in security/kixie-vulnerability-disclosure.yml. The policy exists; the machine-
    readable pointer to it does not.
  remedy: >-
    Serve /.well-known/security.txt with Contact: mailto:security@kixie.com, Policy:
    https://www.kixie.com/security/, Preferred-Languages and Expires. It is a four-line file.

