name: Kixie .well-known probe
description: >-
  Every standard /.well-known/ discovery path was probed against all five Kixie hosts on
  2026-08-12. Nothing was found. No document is served at any path on any host, so this repo
  emits NO WellKnown, APICatalog or SecurityTxt pointer in apis.yml — a recorded absence is the
  finding, not a surface.

hit_count: 0
documents_found: 0
files: []

false_positive_warning: >-
  www.kixie.com and developer.kixie.com are WordPress sites with fuzzy-match URL redirection
  enabled. Every /.well-known/* request returns HTTP 301 to an unrelated marketing page rather
  than 404 — /.well-known/agent-card.json redirects to /integrations/agentforce-marketing/ and
  /.well-known/api-catalog redirects to /features/animation/. A naive probe that follows
  redirects and records the final 200 would credit Kixie with an A2A agent card and an API
  catalog it does not serve. Every 301 below was followed and confirmed to resolve to an HTML
  marketing page, not a document.

