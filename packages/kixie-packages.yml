description: >-
  Kixie publishes no first-party client SDK in any public package registry. Every public registry
  that answers unauthenticated was queried on 2026-08-12 and none returned a Kixie-published
  client library. The documented integration path is raw HTTP — the developer site shows curl
  examples only, with no language bindings offered.

