finding: >-
  No official SDK in any language. For an API whose operations place phone calls and send SMS —
  where retry semantics, phone-number normalisation and webhook verification all have real
  consequences — leaving every integrator to hand-roll an HTTP client against an undocumented
  error surface is the single largest developer-experience gap in the Kixie surface.
remedy: >-
  Publish at minimum a JavaScript/TypeScript and a Python client to npm and PyPI, generated from
  an OpenAPI description of the /app/event dispatch surface.
