method: derived
source: >-
  developer.kixie.com documented eventname dispatch values and support.kixie.com API articles

name: Kixie MCP server
status: candidate

description: >-
  Kixie publishes NO Model Context Protocol server. This file is an API Evangelist derivation, not
  a Kixie artifact: a candidate tool list showing what an MCP server over Kixie's documented HTTP
  surface would expose, so the gap is legible and a first implementation has a starting point. It
  is NOT wired as an `MCPServer` pointer in apis.yml, because Kixie does not serve one and a
  candidate must never be scored as a presence.

published_by_provider: false
official_server: null
probes:
- url: https://mcp.kixie.com/
  http_status: 404
  fetched: '2026-08-12'
- url: https://www.kixie.com/mcp/
  http_status: 200
  fetched: '2026-08-12'
  result: false-positive
  note: >-
    WordPress fuzzy-match redirect resolving to the amoCRM integration marketing page. Body
    fetched and read; contains no MCP content whatsoever.
- url: https://apig.kixie.com/openapi.json
  http_status: 403
  note: Gateway rejects unauthenticated requests; no spec to generate tools from.

derivation_basis: >-
  Tool names and semantics below come from Kixie's documented `eventname` / `action` dispatch
  values and its published request bodies. No parameter is invented — every field listed appears
  verbatim in a Kixie example or parameter table. Input schemas are therefore high-fidelity for
  required fields and incomplete for optional ones, because Kixie publishes no full parameter
  reference for most operations.

grounding_limitation: >-
  Kixie ships no OpenAPI, so there are no operationIds to bind to. No tool crosswalk
  (mcp/kixie-tool-crosswalk.yml) is emitted for this repo, because a crosswalk requires a real
  REST contract on one side and a real MCP contract on the other, and Kixie publishes neither.

candidate_tools:
- name: kixie_make_call
  category: voice
  summary: >-
    Place an outbound call. Rings the named agent first; when the agent answers, dials the target.
  transport:
    method: POST
    url: https://apig.kixie.com/app/event
    discriminator: eventname=call
  input_fields:
    required: [businessid, email, target, eventname, apikey]
    optional: [displayname]
  consequence: irreversible
  consequence_note: >-
    Places a real phone call and incurs per-minute cost. Not idempotent, not retry-safe — Kixie
    documents no idempotency key. An agent must not auto-retry this on timeout.
  docs: https://developer.kixie.com/make-a-call/

- name: kixie_send_sms
  category: messaging
  summary: Send an SMS from the named agent's Kixie number to a target number.
  transport:
    method: POST
    url: https://apig.kixie.com/app/event
    discriminator: eventname=sms
  input_fields:
    required: [businessid, email, target, eventname, message, apikey]
  consequence: irreversible
  consequence_note: >-
    Delivers a message to a consumer handset. Subject to TCPA and 10DLC obligations. Not
    retry-safe.
  docs: https://developer.kixie.com/automation-send-sms/

- name: kixie_send_team_sms
  category: messaging
  summary: Send a Business/Team SMS from a shared Team SMS identity.
  transport:
    method: POST
    url: https://apig.kixie.com/app/event
    discriminator: eventname=bizsms
  input_fields:
    required: [businessid, target, eventname, id, message, apikey]
    optional: [fromNumber]
  consequence: irreversible
  docs: https://developer.kixie.com/team-sms-api/

- name: kixie_send_to_queue
  category: voice
  summary: Send a call to a Kixie inbound queue, ringing an agent then dialing the target.
  transport:
    method: POST
    url: https://apig.kixie.com/app/event
    discriminator: eventname=queue
  input_fields:
    required: [businessid, email, target, eventname, id, apikey]
    optional: [displayname]
  consequence: irreversible
  docs: https://developer.kixie.com/automation-send-to-queue/

- name: kixie_remove_from_queue
  category: voice
  summary: Remove a number from a queue.
  transport:
    method: POST
    url: https://apig.kixie.com/app/event
    discriminator: eventname=queue&action=remove
  input_fields:
    required: [businessid, email, target, eventname, action, id, apikey]
  consequence: reversible
  docs: https://developer.kixie.com/automation-remove-from-queue/

- name: kixie_flush_queue
  category: voice
  summary: Flush every number currently waiting in a specific user queue.
  transport:
    method: POST
    url: https://apig.kixie.com/app/legacy/flushUserQueue
    discriminator: call=flushUserQueue
  input_fields:
    required: [call, apikey, id, userid, businessid]
  consequence: destructive
  consequence_note: >-
    Bulk, unbounded, and irreversible — drops every queued call with no confirmation step and no
    documented response. Served from an explicitly `/legacy/` path. Any agent exposure of this
    tool should require human escalation.
  docs: https://developer.kixie.com/automation-flush-queue/

- name: kixie_add_to_powerlist
  category: crm
  summary: Add or update a single contact in a PowerList, keyed on the target phone number.
  transport:
    method: POST
    url: https://apig.kixie.com/app/event
    discriminator: eventname=updatepowerlist
  input_fields:
    required: [businessid, powerlistId, target, eventname, apikey]
    optional: [firstName, lastName, title, companyName, email, nextCallRefresher, crmUserId, crmContactId, duplicateHandling, extraData]
  consequence: reversible
  consequence_note: >-
    Effectively idempotent per target number, but `duplicateHandling: overwrite` is destructive by
    omission — fields absent from the request overwrite existing values with null. An agent should
    default to `merge`.
  docs: https://support.kixie.com/hc/en-us/articles/19135310564635-PowerList-API

- name: kixie_remove_from_powerlist
  category: crm
  summary: Remove one or more contacts from a specific PowerList.
  transport:
    method: POST
    url: https://apig.kixie.com/app/event
    discriminator: eventname=removefrompowerlist&action=removefrompowerlist
  input_fields:
    required: [businessid, target, eventname, action, powerlistId, apikey]
  input_note: '`target` accepts an array of phone numbers on this operation.'
  consequence: destructive
  docs: https://developer.kixie.com/automation-remove-from-powerlist/

- name: kixie_remove_from_all_powerlists
  category: crm
  summary: Remove one or more contacts from every PowerList in the account.
  transport:
    method: POST
    url: https://apig.kixie.com/app/event
    discriminator: eventname=removefrompowerlist&action=removefromallpowerlists
  input_fields:
    required: [businessid, target, eventname, action, apikey]
  consequence: destructive
  consequence_note: Account-wide deletion. Should require human escalation.
  docs: https://developer.kixie.com/automation-remove-from-all-powerlists/

- name: kixie_send_to_cadence
  category: automation
  summary: Add a contact to an automation cadence.
  transport:
    method: POST
    url: https://apig.kixie.com/app/event
    discriminator: eventname=cadence
  input_fields:
    required: [businessid, target, eventname, cadenceid, apikey]
    optional: [displayname, action]
  consequence: irreversible
  consequence_note: >-
    Enrolling a contact starts a multi-step outreach sequence — calls and messages will be sent
    over time without further API calls.
  docs: https://developer.kixie.com/automation-send-to-cadence/
  documentation_defect: >-
    Kixie's "Send to Cadence" page and its "Remove From Cadence" page publish an IDENTICAL example
    body, both carrying "action": "remove". The add-to-cadence request shape is therefore not
    actually documented. Verify against the provider before implementing.

- name: kixie_remove_from_cadence
  category: automation
  summary: Remove a contact from an automation cadence.
  transport:
    method: POST
    url: https://apig.kixie.com/app/event
    discriminator: eventname=cadence&action=remove
  input_fields:
    required: [businessid, target, eventname, action, cadenceid, apikey]
  consequence: reversible
  docs: https://developer.kixie.com/automation-remove-from-cadence/

- name: kixie_get_agent_status
  category: presence
  summary: >-
    Read whether an agent is logged in and whether they are currently on a call. The only
    read-only operation in the entire public Kixie surface.
  transport:
    method: GET
    url: https://apig.kixie.com/www/agent/status
  input_fields:
    required: [apiKey, email]
  input_note: 'Note the camel-cased `apiKey` here, unlike `apikey` everywhere else.'
  consequence: read-only
  docs: https://support.kixie.com/hc/en-us/articles/360020051474-Kixie-Agent-Status-API

- name: kixie_create_webhook
  category: webhooks
  summary: Register an HTTP callback for one of the eight documented event types.
  transport:
    method: POST
    url: https://apig.kixie.com/app/v1/api/postwebhook
    discriminator: call=postWebhook
  input_fields:
    required: [apikey, businessid, call, eventname, location, name, runtime]
    optional: [callresult, direction, disposition, headers]
  consequence: reversible
  docs: https://support.kixie.com/hc/en-us/articles/20871662051739-Managing-Kixie-Event-Webhooks-via-API

- name: kixie_update_webhook
  category: webhooks
  summary: Modify an existing webhook registration.
  transport:
    method: POST
    url: https://apig.kixie.com/app/v1/api/postwebhook
    discriminator: call=putWebhook
  input_fields:
    required: [apikey, businessid, call, webhookid, eventname, location, name, runtime]
    optional: [callresult, direction, disposition, headers]
  consequence: reversible
  docs: https://support.kixie.com/hc/en-us/articles/20871662051739-Managing-Kixie-Event-Webhooks-via-API

- name: kixie_list_webhooks
  category: webhooks
  summary: List every webhook registered on the account.
  transport:
    method: POST
    url: https://apig.kixie.com/app/v1/api/getWebhooks
    discriminator: call=getWebhooks
  input_fields:
    required: [apikey, businessid, call]
  consequence: read-only
  note: A read performed over POST; no pagination documented.
  docs: https://support.kixie.com/hc/en-us/articles/20871662051739-Managing-Kixie-Event-Webhooks-via-API

- name: kixie_delete_webhook
  category: webhooks
  summary: Delete a webhook by id.
  transport:
    method: POST
    url: https://apig.kixie.com/app/v1/api/deleteWebhooks
    discriminator: call=removeWebhook
  input_fields:
    required: [apikey, businessid, call, webhookid]
  consequence: destructive
  docs: https://support.kixie.com/hc/en-us/articles/20871662051739-Managing-Kixie-Event-Webhooks-via-API

tool_count: 16
read_only_tool_count: 2
irreversible_tool_count: 5
destructive_tool_count: 4

agent_safety_note: >-
  Fourteen of sixteen candidate tools mutate state and five of them act on the physical world by
  placing a call or delivering a message to a consumer handset. Kixie provides none of the
  controls an agent runtime needs to do this safely: no idempotency key, no scoped credentials
  (one account-wide key authorises every tool), no dry-run or preview mode, no sandbox or test
  number range, no documented error semantics to distinguish "not sent" from "unknown", and no
  rate-limit headers to pace against the 10,000/day account quota. Any MCP server built over this
  surface should hold `kixie_flush_queue`, `kixie_remove_from_all_powerlists` and the two
  outbound-communication tools behind explicit human confirmation.

authentication:
  scheme: account-scoped API key + Business ID
  oauth: false
  see: authentication/kixie-authentication.yml

remedy_for_provider: >-
  Publish an OpenAPI description of the /app/event dispatch surface, then generate an MCP server
  from it. The operation set is small and stable; the blocker is the absence of a machine-readable
  contract, not the complexity of the API.
