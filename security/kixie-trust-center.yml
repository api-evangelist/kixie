not_published:
- SOC 2 or ISO report (even under NDA via a self-serve request flow)
- subprocessor list
- data-residency or hosting-architecture statement
- data-retention periods (including for call recordings and transcriptions)
- encryption-at-rest / in-transit control descriptions
- penetration-test cadence or summary
- incident-response or breach-notification commitment
- uptime SLA
- DPA availability statement

evaluation_path:
  self_serve: false
  mechanism: >-
    "Customers evaluating Kixie can ask their Kixie representative which current security,
    privacy, and contractual materials are available for their review. Availability may depend on
    the request and applicable confidentiality requirements."
  finding: >-
    Every security artefact an enterprise buyer needs sits behind a sales conversation with an
    explicitly conditional outcome. There is no self-serve trust portal, no NDA-gated document
    request form, and no list of what exists — a buyer cannot even learn WHICH reports Kixie holds
    without contacting a representative.

compliance_pointer_emitted: false
compliance_pointer_note: >-
  This repo emits a `TrustCenter` pointer because the page genuinely exists and is public, but
  emits NO `Compliance` pointer, because Kixie publishes no certification or compliance-program
  claim. Crediting Kixie with published compliance on the strength of a routing page would be
  exactly the kind of presence-from-absence error this pipeline exists to avoid.

assessment: >-
  As a trust centre this is thin — it is a signpost, not a disclosure. But it is an honest
  signpost, and honest thinness is materially better than the common alternative of a badge wall
  asserting controls that were never audited. The gap that matters most for a communications
  platform is retention: Kixie posts call-recording URLs and AI-generated call summaries to
  customer webhook endpoints and publishes no retention period for either.

