certifications_finding: >-
  No SOC 2 Type I or II, ISO 27001, ISO 27701, PCI DSS, HIPAA/BAA, FedRAMP, StateRAMP, CSA STAR
  or Cyber Essentials claim appears anywhere on Kixie's public surface. The page states the
  omission is deliberate: "This public page intentionally does not claim a certification, audit
  result, hosting architecture, retention period, or control that has not been confirmed for
  publication."

