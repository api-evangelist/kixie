name: Kixie data model
description: >-
  Entity/relationship graph for the Kixie platform, derived from the JSON payloads Kixie
  publishes. Kixie ships no OpenAPI and therefore no components.schemas, so this graph is
  reconstructed from documented webhook payloads and request bodies rather than from $ref links.
  Field names and types below are taken verbatim from Kixie's own examples; where a type is
  ambiguous in the examples, that ambiguity is recorded rather than resolved.

derivation_note: >-
  Confidence is field-level. An entity is `high` when it appears as a named object in a published
  payload with a stable key set; `medium` when it is only ever referenced by a bare id field. No
  entity here is inferred from the product marketing.

identifier_conventions:
  finding: >-
    Kixie uses at least four unrelated identifier schemes and applies them inconsistently, and the
    same logical key appears under different names in different payloads. This is the dominant
    integration hazard in the data model.
  schemes:
  - kind: uuid
    used_by: callid, externalid, messageid
    example_shape: 8-4-4-4-12 hex
  - kind: numeric-string
    used_by: businessid, userid, powerlistId, cadenceid, contactid, dealid, queue id
  - kind: e164-phone
    used_by: target, tonumber164, fromnumber164
    note: The de-facto primary key for a PowerList contact.
  - kind: email
    used_by: email (agent identity on the Event API)
    note: >-
      The Event API addresses an agent by email address, not by user id — so an agent's identity
      key on the request path differs from the `userid` returned in webhook payloads.
  inconsistencies:
  - >-
      `callid` is a UUID in most webhook payloads but a numeric string in the Disposition and
      Scheduled Activity payloads (e.g. "callid": "368131317"), where the UUID moves to
      `externalid`. A consumer joining on `callid` across event types will not match.
  - >-
      Casing drifts between and within payloads: `powerlistId` (request bodies) vs `powerlistid`
      (webhook payloads) vs `powerlistSessionId` vs `powerlistsessionid`.
  - >-
      `crmContactId` (request body) vs `contactid` (webhook payload) vs `externalcrmid` refer to
      overlapping CRM linkage concepts with no published mapping.
  - >-
      Booleans arrive as integers (0/1) inside `result` on the Agent Status API and as real
      booleans elsewhere.
  - >-
      `businessid` is a quoted string in some payloads and an unquoted number in others.

entities:
- name: Business
  key: businessid
  confidence: high
  description: >-
    The Kixie tenant. Scopes every credential, every PowerList, every queue and every webhook.
    One API key per Business.
  fields:
  - businessid
  - businessnumber
  relationships:
  - has_many: User
    via: businessid
  - has_many: PowerList
    via: businessid
  - has_many: Webhook
    via: businessid
  - has_many: Call
    via: businessid
  - has_many: PhoneNumber
    via: businessid

- name: User
  aliases: [Agent]
  key: userid
  alternate_key: email
  confidence: high
  description: >-
