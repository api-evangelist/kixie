- name: Recording
  key: recordingurl
  confidence: high
  description: >-
    An MP3 of the call, served from calls.kixie.com and named by the call UUID.
  fields:
  - recordingurl
  - recordingsid
  - recordingduration
  url_pattern: https://calls.kixie.com/{callid}.mp3
  note: >-
    The URL is deterministic from the call UUID. Kixie publishes no statement about whether the
    recording endpoint requires authentication or how long recordings are retained — a material
    gap for a payload that Kixie posts to unauthenticated customer webhook endpoints.
  relationships:
