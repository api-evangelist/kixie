gaps:
- No published schema for any entity — no OpenAPI components, no JSON Schema, no TypeScript types.
- No documented field-level types; types above are inferred from example values.
- No documented enum for disposition, callstatus, destinationName or lastDialOutcome — the values
  recorded here are only those that happen to appear in published examples and are certainly
  incomplete.
- No documented retention policy for calls, recordings or transcriptions.
- No read API for any entity. Every documented operation is a write or a webhook; there is no way
  to list PowerLists, fetch a call record, or read a contact back out of Kixie over HTTP.
