  fields:
  - powerlistSessionId
  - powerlistContactStatus
  - lastDialOutcome
  - agentEmail
  - ownerUserId
  - externalOwnerId
  enums_observed:
    powerlistContactStatus: [rescheduling]
    lastDialOutcome: ['Lost Race']
  relationships:
  - belongs_to: PowerList
    via: powerlistId
  - belongs_to: User
    via: agentEmail
  - has_many: Call
    via: powerlistsessionid

