- name: Contact
  key: contact_id
  alternate_key: phone_number
  confidence: high
  description: >-
    A person. Kixie holds two different contact shapes: the snake_case shape it EXPECTS from a
    customer-operated Contact Lookup endpoint, and the camelCase shape it EMITS inside SMS
    webhook payloads. They are not the same schema.
  shapes:
  - context: contact-lookup (Kixie consumes, customer implements)
    casing: snake_case
    fields: [first_name, last_name, url, contact_id, email, phone_number, town, postal, state, address]
  - context: sms webhook (Kixie emits)
    casing: camelCase
    fields: [firstName, lastName, name, phone, email, id, link, street, city, state, zip]
  finding: >-
    `town` vs `city`, `postal` vs `zip`, `url` vs `link`, `contact_id` vs `id` — the same nine
    concepts under two naming conventions in one product. An integrator must maintain two mappers.
  relationships:
  - has_one: Deal
    via: deal_id
  - has_one: Organization
    via: org
  - has_many: Call
    via: contactid

- name: Deal
  key: deal_id
  confidence: medium
  description: An opportunity in the customer's CRM, surfaced in the dialer via Contact Lookup.
  fields: [title, value, status, stage, deal_id, url]
  optional: true
  relationships:
  - belongs_to: Contact

- name: Organization
  key: name
  confidence: low
  description: The account a contact belongs to. Only ever published as a single `name` field.
  fields: [name]
  optional: true
  relationships:
  - belongs_to: Contact

- name: PowerList
  key: powerlistId
  confidence: high
  description: >-
    A dialing list. Contacts are keyed on the target phone number, not on a contact id — Kixie
    states explicitly that one lead with two numbers is two PowerList contacts.
  fields:
  - powerlistId
  - target
  - firstName
  - lastName
  - title
  - companyName
  - email
  - nextCallRefresher
  - crmUserId
  - crmContactId
  - duplicateHandling
  - extraData
  natural_key: target (E.164 phone number)
  write_semantics:
    duplicateHandling:
      overwrite: Replaces all fields; omitted fields overwrite existing values with null.
      merge: Replaces only fields present in the request; omitted fields are preserved.
      ignore: Leaves an existing contact untouched; only new contacts are added.
    note: >-
      `overwrite` is destructive by omission — a partial update silently erases fields the caller
      did not send. This is the single most dangerous parameter in the Kixie API.
  extension_point:
    field: extraData
    type: map<string, string>
    note: Keys become PowerList column names. Untyped, unschematised, no documented limits.
  relationships:
  - belongs_to: Business
    via: businessid
  - has_many: PowerListContact
    via: powerlistId
  - has_many: PowerListSession
    via: powerlistId

- name: PowerListSession
  key: powerlistSessionId
  confidence: high
