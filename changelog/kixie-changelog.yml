  checked: '2026-08-12'
  months_since_last_entry: 18
  finding: >-
    The most recent dated product update is 13 February 2025 — roughly eighteen months before this
    check. The product has demonstrably shipped in that window (the security page carries a
    "Last reviewed: August 3, 2026" stamp, the pricing page was rebuilt around three new tier
    names, and the help center gained an "AI Insights Guide"), so the changelog is stale rather
    than the product being static. An integrator watching this surface for breaking changes would
    have seen nothing for a year and a half.

