description: >-
  Kixie publishes dated product updates in a "Product Updates" category of its Zendesk help
  center, split into two sections — Kixie Dashboard Updates and Kixie PowerCall Updates. There is
  no API-specific changelog, no release-notes feed, and no version history for the HTTP API or the
  webhook payload schemas. The product changelog itself has not been updated since February 2025.

